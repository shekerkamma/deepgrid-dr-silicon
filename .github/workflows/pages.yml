name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['source/**']
  pull_request:
    paths-ignore: ['source/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # github.io project site for now. For dr.deepgridsemi.com set PAGES_BASE: / and PAGES_DOMAIN: dr.deepgridsemi.com
      PAGES_BASE: /deepgrid-dr-silicon_new/
      PAGES_DOMAIN: ''
      # Zero-API-cost static build: no external model keys or endpoints are inlined.
      # Ask DeepGrid runs fully in-browser over the 280-node knowledge graph and deterministic council.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:pages
      # The browser gate (scripts/verify-site.mjs) on the built site, served under the same base path Pages uses.
      # A red gate stops the deploy.
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          mkdir -p "$RUNNER_TEMP/srv"
          ln -s "$PWD/dist/pages" "$RUNNER_TEMP/srv/deepgrid-dr-silicon_new"
          python3 -m http.server 8768 --directory "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
          until curl -sf http://127.0.0.1:8768/deepgrid-dr-silicon_new/ >/dev/null; do sleep 1; done
      - run: npm run verify -- http://127.0.0.1:8768/deepgrid-dr-silicon_new/ verify-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: verify-shots
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  # The same gate against the live site, once Pages serves this commit (build-info.json carries the SHA).
  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://shekerkamma.github.io/deepgrid-dr-silicon_new/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for Pages to serve this commit
        run: |
          for i in $(seq 60); do
            curl -sf "${SITE}build-info.json?$i" | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "Pages did not serve $GITHUB_SHA within 10 minutes"; exit 1
      - run: npm run verify -- "$SITE" verify-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-live-shots
          path: verify-shots
