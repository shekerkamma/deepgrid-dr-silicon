name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['source/**']
  pull_request:
    paths-ignore: ['source/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Derived from the repository name, so one source tree builds correctly in every repo that
      # hosts it. The same commit serves /deepgrid-dr-silicon/, /deepgrid-dr-silicon_new/ and
      # /deepgrid-dr-silicon-v2/; hardcoding one of them 404s every asset and link in the other two.
      # For a custom domain set PAGES_BASE and NEXT_PUBLIC_PAGES_BASE to / and PAGES_DOMAIN to the host.
      PAGES_BASE: /${{ github.event.repository.name }}/
      # Baked into the bundle so server-rendered HTML carries correct hrefs, not just hydrated HTML.
      NEXT_PUBLIC_PAGES_BASE: /${{ github.event.repository.name }}/
      PAGES_DOMAIN: ''
      # Zero-API-cost static build: no external model keys or endpoints are inlined.
      # Ask DeepGrid runs fully in-browser over the 280-node knowledge graph and deterministic council.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:pages
      # The multi-route browser gate (scripts/verify-routes.mjs) on the built site, served under the same base path Pages uses.
      # A red gate stops the deploy.
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          mkdir -p "$RUNNER_TEMP/srv"
          ln -s "$PWD/dist/pages" "$RUNNER_TEMP/srv/${{ github.event.repository.name }}"
          # Threaded: the stock http.server is single-threaded and stalls one chunk request
          # per page load once the home route imports the scroll engine.
          python3 scripts/serve-dist.py 8768 "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
          until curl -sf http://127.0.0.1:8768/${{ github.event.repository.name }}/ >/dev/null; do sleep 1; done
      - run: node scripts/verify-routes.mjs http://127.0.0.1:8768/${{ github.event.repository.name }}/ verify-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: verify-shots
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  # The same gate against the live site, once Pages serves this commit (build-info.json carries the SHA).
  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for Pages to serve this commit
        run: |
          for i in $(seq 60); do
            curl -sf "${SITE}build-info.json?$i" | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "Pages did not serve $GITHUB_SHA within 10 minutes"; exit 1
      - run: node scripts/verify-routes.mjs "$SITE" verify-shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-live-shots
          path: verify-shots

  # Propagate this commit to the two mirror repos, so one push to v2 updates all three sites.
  #
  # Runs only in the source repo and only after verify-live: a mirror must never receive a commit
  # that failed its own gate in the repo that owns it.
  #
  # Authenticated with one SSH deploy key per mirror, not a personal access token. GITHUB_TOKEN is
  # scoped to the repository running the workflow and cannot push elsewhere, but the obvious
  # alternative, an account PAT, carries `repo` across every repository the owner has. A deploy key
  # is write access to exactly one repo, which is all this job needs. Revoking one is deleting one
  # key from one repo and breaks nothing else.
  mirror:
    if: github.event_name != 'pull_request' && github.repository == 'shekerkamma/deepgrid-dr-silicon-v2'
    needs: verify-live
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: deepgrid-dr-silicon
            secret: MIRROR_KEY_DEEPGRID_DR_SILICON
          - repo: deepgrid-dr-silicon_new
            secret: MIRROR_KEY_DEEPGRID_DR_SILICON_NEW
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Push to ${{ matrix.repo }}
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::${{ matrix.secret }} is not set, so ${{ matrix.repo }} was not updated."
            echo "Until it is, run: npm run sync"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes"
          git push --force "git@github.com:shekerkamma/${{ matrix.repo }}.git" \
            "${{ github.sha }}:refs/heads/main"
          echo "Pushed ${{ github.sha }} to ${{ matrix.repo }}"
